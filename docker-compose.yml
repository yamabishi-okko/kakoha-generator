# ☁️① docker compose up -d でこのファイルが読み込まれ、2つのサービスが起動する
services:

  # ☁️② frontend サービス：ルートの Dockerfile を使って Angular コンテナを構築する
  frontend:
    build: .
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  # ☁️③ backend サービス：backend/Dockerfile を使って Laravel コンテナを構築する
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

# ☁️④ named volumes：コンテナ内でインストールした node_modules / vendor を、ホストのマウントで上書きされないよう保持する
volumes:
  frontend_node_modules:
  backend_vendor:
